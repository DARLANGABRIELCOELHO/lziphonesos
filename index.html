<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova ordem de serviço | LZ iPhones</title>
  <link rel="icon" href="assets/logo-os.png">
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <div class="app">
    <main class="painel">
      <header class="painel-topo">
        <img src="assets/logo-os.png" alt="LZ iPhones" width="120" height="43">
        <button type="button" class="botao-texto" id="novo">Limpar para nova OS</button>
      </header>

      <h1>Nova ordem de serviço</h1>

      <form id="form" autocomplete="off" novalidate>
        <div class="grade abertura">
          <label class="campo">
            <span>Nº da OS</span>
            <input id="numero" readonly tabindex="-1" aria-describedby="numero-nota">
            <small class="nota" id="numero-nota">Buscando o número...</small>
          </label>
          <label class="campo">
            <span>Data de entrada</span>
            <input id="data" type="date" required>
          </label>
        </div>

        <fieldset>
          <legend>Cliente</legend>
          <label class="campo">
            <span>Nome</span>
            <input id="nome" required>
          </label>
          <div class="grade">
            <label class="campo">
              <span>Telefone para contato</span>
              <input id="telefone" inputmode="tel" maxlength="15" required aria-describedby="telefone-aviso">
              <small class="aviso" id="telefone-aviso"></small>
            </label>
            <label class="campo">
              <span>CPF (opcional)</span>
              <input id="cpf" inputmode="numeric" maxlength="14" aria-describedby="cpf-aviso">
              <small class="aviso" id="cpf-aviso"></small>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Aparelho</legend>
          <div class="grade">
            <label class="campo">
              <span>Modelo do aparelho</span>
              <input id="modelo" required>
            </label>
            <label class="campo">
              <span>Cor</span>
              <input id="cor">
            </label>
          </div>
          <label class="campo">
            <span>Senha</span>
            <input id="senha" spellcheck="false" autocapitalize="off">
          </label>

          <div class="padrao">
            <div class="celular">
              <div class="pontos" id="pontos" role="group" aria-labelledby="padrao-t">
                <svg id="padrao-linhas" viewBox="0 0 300 300" aria-hidden="true"></svg>
              </div>
            </div>
            <div class="padrao-texto">
              <span class="grupo-t" id="padrao-t">Padrão de desbloqueio</span>
              <p class="nota" id="padrao-nota" role="status"></p>
              <button type="button" class="botao-texto" id="padrao-apagar" hidden>Apagar padrão</button>
            </div>
          </div>

          <div id="perguntas"></div>
        </fieldset>

        <fieldset>
          <legend>Serviço</legend>
          <label class="campo">
            <span>Serviços</span>
            <textarea id="servicos" rows="3" aria-describedby="servicos-aviso servicos-nota"></textarea>
            <small class="aviso" id="servicos-aviso"></small>
            <small class="nota" id="servicos-nota" hidden>No canhoto, o serviço sai resumido em 2 linhas.</small>
          </label>
          <label class="campo">
            <span>Observações</span>
            <textarea id="observacoes" rows="3" aria-describedby="observacoes-aviso"></textarea>
            <small class="aviso" id="observacoes-aviso"></small>
          </label>
          <label class="campo">
            <span>Valor do serviço (R$)</span>
            <input id="valor" class="moeda" inputmode="numeric" maxlength="12" aria-describedby="valor-nota">
            <small class="nota" id="valor-nota">Sem preencher, sai em branco para escrever à caneta.</small>
          </label>
        </fieldset>
      </form>

      <footer class="acoes">
        <p class="pendencias" id="pendencias" role="status"></p>
        <div class="acoes-botoes">
          <a class="botao-texto ver-folha" href="#mesa">Ver OS</a>
          <button type="button" class="botao" id="gerar">Gerar PDF</button>
        </div>
      </footer>
    </main>

    <section class="mesa" id="mesa" aria-label="Prévia da ordem de serviço">
      <p class="mesa-nota">O que você digita aparece em azul só aqui. No PDF, sai tudo em preto.</p>
      <div id="documento"></div>
    </section>
  </div>

  <script src="metricas.js"></script>
  <script src="os.js"></script>
  <script src="pdf.js"></script>
  <script src="app.js"></script>
</body>
</html>
